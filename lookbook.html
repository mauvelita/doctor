<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#181818" />
  <title>Lookbook — Théoden Yegor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <main class="page page--center">
    <div class="page-inner">
      <div class="look-stage" aria-label="Lookbook slideshow">
        <div class="look-window" id="look-window">
          <img class="is-active" src="look1.jpeg" alt="" />
          <img src="look2.jpeg" alt="" />
          <img src="look3.jpeg" alt="" />
          <img src="look4.jpeg" alt="" />
          <img src="look5.jpeg" alt="" />
          <img src="look6.jpeg" alt="" />
          <img src="look7.jpeg" alt="" />
          <img src="look8.jpeg" alt="" />
          <img src="look9.jpeg" alt="" />
          <img src="look10.jpeg" alt="" />
        </div>
        <img class="look-frame" src="frame.png" alt="" />
      </div>

      <a class="back" href="index.html#enter" aria-label="Return to Enter the Clinic">
        <img src="sword.png" alt="" width="394" height="263" />
      </a>
    </div>
  </main>

  <script>
    (() => {
      const slides = Array.from(document.querySelectorAll("#look-window img"));
      if (slides.length < 2) return;

      let i = 0;
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const ms = reduce ? 0 : 3800;

      const show = (n) => {
        slides[i].classList.remove("is-active");
        i = (n + slides.length) % slides.length;
        slides[i].classList.add("is-active");
      };

      if (ms) {
        window.setInterval(() => show(i + 1), ms);
      }
    })();
  </script>
</body>
</html>
